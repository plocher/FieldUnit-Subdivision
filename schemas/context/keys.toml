# The context key registry (FieldUnit ADR 0004 R7, R8).
#
# The vocabulary of settings a driver may read: namespaces fixed now, keys added as the need
# arises. Static keys resolve most specific first: drawing (a symbol attribute) -> plant (the
# INTERLOCKING) -> layout (the root sheet) -> era profile -> library default; the compiler resolves
# them per symbol instance. Runtime keys come from the field unit.
#
# Key fields
#   key         namespace.name
#   type        string | int | bool | ms | deg | ratio | color | palette | enum:A|B
#   levels      where it may be set: drawing, plant, layout, profile, runtime
#   default     the library default ("" = none yet)
#   attribute   the symbol attribute that sets it at drawing level, if any (ADR 0003 axiom 6 spelling)
#   meaning     one line
#
# Not context (and so not here): binding attributes that address a channel or say what a symbol
# shows (Chain, Index, Address, IndicationToken), and model data about the plant (CP, TC,
# Indications, Direction, Vital, ControlToken). The library lint checks every attribute lands in
# exactly one of the three.

version = 1

[namespace]
era      = "the era represented"
rulebook = "the rulebook represented; which aspect each signal indication takes"
timing   = "durations: flash, fade, travel, hold, steps"
motion   = "servo angles, speeds, direction of travel"
color    = "named colours and their values, era-appropriate"
light    = "layout-wide lamp rendering: gamma, brightness, dimming"
clock    = "time of day, daylight (runtime)"
mode     = "lamp test, maintainer test (runtime; may need the interlocking's consent, FieldUnit ADR 0004)"

# ---------------------------------------------------------------- era, rulebook

[[key]]
key = "era.name"
type = "string"
levels = ["layout", "plant"]
default = ""
meaning = "the era represented, e.g. 1985"

[[key]]
key = "rulebook.name"
type = "string"
levels = ["layout", "plant"]
default = ""
meaning = "the rulebook whose charts map signal indications to aspects, e.g. SP1985"

# ---------------------------------------------------------------- timing

[[key]]
key = "timing.flash_ms"
type = "ms"
levels = ["profile", "layout"]
default = "1000"
meaning = "flash period (one shared phase per field unit)"

[[key]]
key = "timing.hold_ms"
type = "ms"
levels = ["profile", "layout", "plant", "drawing"]
default = "1500"
attribute = "Hold_ms"
meaning = "optical detector release hold (bridges inter-car gaps)"

[[key]]
key = "timing.travel_ms"
type = "ms"
levels = ["profile", "layout", "drawing"]
default = "2000"
attribute = "Travel_ms"
meaning = "simulated switch travel time"

[[key]]
key = "timing.fade_ms"
type = "ms"
levels = ["profile", "layout", "drawing"]
default = ""
attribute = "Fade_ms"
meaning = "lamp cross-fade time"

# ---------------------------------------------------------------- motion

[[key]]
key = "motion.normal_is"
type = "enum:HIGH|LOW|LOW_ANGLE|HIGH_ANGLE"
levels = ["drawing"]
default = ""
attribute = "NormalIs"
meaning = "which output level or angle end is the normal position"

[[key]]
key = "motion.normal_deg"
type = "deg"
levels = ["drawing"]
default = ""
attribute = "Normal_deg"
meaning = "servo switch normal angle"

[[key]]
key = "motion.reverse_deg"
type = "deg"
levels = ["drawing"]
default = ""
attribute = "Reverse_deg"
meaning = "servo switch reverse angle"

[[key]]
key = "motion.speed"
type = "int"
levels = ["profile", "layout", "drawing"]
default = ""
attribute = "Speed"
meaning = "servo speed"

[[key]]
key = "motion.stop_deg"
type = "deg"
levels = ["drawing"]
default = ""
attribute = "Stop_deg"
meaning = "semaphore arm at stop"

[[key]]
key = "motion.approach_deg"
type = "deg"
levels = ["drawing"]
default = ""
attribute = "Approach_deg"
meaning = "semaphore arm at approach"

[[key]]
key = "motion.clear_deg"
type = "deg"
levels = ["drawing"]
default = ""
attribute = "Clear_deg"
meaning = "semaphore arm at clear"

# ---------------------------------------------------------------- color, light

[[key]]
key = "color.palette"
type = "palette"
levels = ["profile", "layout"]
default = ""
meaning = "named colours (red, amber, yellow, green, blue, lunar, …) to values; era-appropriate"

[[key]]
key = "color.lamp"
type = "color"
levels = ["drawing"]
default = ""
attribute = "Color"
meaning = "the lamp's colour, a name in color.palette"

[[key]]
key = "light.gamma"
type = "ratio"
levels = ["layout"]
default = ""
meaning = "layout-wide gamma"

[[key]]
key = "light.brightness"
type = "ratio"
levels = ["layout", "plant"]
default = ""
meaning = "layout-wide brightness"

# ---------------------------------------------------------------- runtime

[[key]]
key = "clock.time_of_day"
type = "int"
levels = ["runtime"]
default = ""
meaning = "minutes since midnight, layout time"

[[key]]
key = "clock.daylight"
type = "bool"
levels = ["runtime"]
default = ""
meaning = "daylight (a semaphore lamp is lit at night)"

[[key]]
key = "mode.lamp_test"
type = "bool"
levels = ["runtime"]
default = ""
meaning = "lamp test"

[[key]]
key = "mode.maintainer"
type = "bool"
levels = ["runtime"]
default = ""
meaning = "maintainer test mode"
