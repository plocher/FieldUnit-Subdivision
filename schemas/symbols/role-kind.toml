# The (Role, Kind) table: one row per logic block (FieldUnit ADR 0003 D1, naming axiom 1).
#
# One source for: which symbols implement a Kind, each pin's type, the attributes a Kind takes.
# The libraries are linted against it (ADR 0003 rule 8: tools/contract/lint_libraries.py); the
# compiler reads it. It states the target set by the accepted ADRs; where a library differs, the
# lint reports it.
#
# Row fields
#   role, kind     the key. Role is the namespace; a Kind is unique within its Role (D1).
#   block          the logic block the row maps to (a FieldUnit class, or what consumes the row).
#   symbols        library symbols implementing the row ("Library:Symbol"). Variants that differ
#                  only in graphics (colour, diagonal) share a row.
#   pins           required pins: base name (no ~{}) -> type.
#   packaging      pins a symbol may add without changing the logic block (ADR 0003 D2), e.g. -OS.
#   membership     pins that say where a symbol belongs, never what it does (a desk Column).
#   attributes     attribute -> what it holds. Polarity attributes are not listed: every BIT pin
#                  carries one, named for the pin (ADR 0003 D6), and the lint checks that by rule.
#   proposed       true when the row is a proposal waiting for the owner (not yet in an ADR).
#
# Pin types
#   BIT       one asserted bit; ~{X} is asserted-low (the norm), X asserted-high (ADR 0003 D6)
#   LEVEL     one bit with no asserted state (a motor's M, a mux select code); NormalIs where it applies
#   DUTY      PWM duty            ANGLE   servo angle
#   BIT|DUTY|ANGLE on a driver: what that driver pin can carry. A device pin wires only to a driver
#             pin that can carry its type (LEVEL rides on BIT).
#   TRACK     a track net leg     SIGNAL  mast to its IRJ     HEAD   head to its mast
#   HOUSE     membership of a house, interlocking, maintainer call
#   COLUMN    a desk column       CODELINE / ENCODING  machine to transport to encoding
# A net joins pins of one family only (ADR 0004 D12): plant (TRACK/SIGNAL/HEAD/HOUSE), channel
# (BIT/LEVEL/DUTY/ANGLE), column, code line.

version = 1

