<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111">Corporal, Sargent and Watsonville: the track between control points (from spcoast.layout.json)</text>
  <text x="20" y="42" fill="#444">North is left. Boxes are interlocking limits. Dashed verticals are NextCP pairs, where one interlocking's drawing stops and the next begins.</text>

  <!-- interlocking limits -->
  <rect x="30" y="120" width="120" height="60" fill="#eef3fb" stroke="#6b88b5"/>
  <text x="90" y="196" text-anchor="middle" font-weight="bold" fill="#234">Corporal</text>
  <rect x="520" y="120" width="120" height="60" fill="#eef3fb" stroke="#6b88b5"/>
  <text x="580" y="196" text-anchor="middle" font-weight="bold" fill="#234">Sargent</text>
  <rect x="835" y="120" width="155" height="60" fill="#eef3fb" stroke="#6b88b5"/>
  <text x="910" y="196" text-anchor="middle" font-weight="bold" fill="#234">Watsonville</text>

  <!-- track -->
  <line x1="20" y1="150" x2="730" y2="150" stroke="#111" stroke-width="3"/>
  <line x1="730" y1="150" x2="840" y2="150" stroke="#111" stroke-width="3" stroke-dasharray="6,5"/>
  <line x1="840" y1="150" x2="990" y2="150" stroke="#111" stroke-width="3"/>

  <!-- plain insulated joints -->
  <line x1="250" y1="142" x2="250" y2="158" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="142" x2="440" y2="158" stroke="#111" stroke-width="2"/>

  <!-- NextCP pairs -->
  <line x1="360" y1="60" x2="360" y2="290" stroke="#999" stroke-dasharray="4,4"/>
  <text x="360" y="56" text-anchor="middle" fill="#666">NextCP pair</text>
  <line x1="730" y1="60" x2="730" y2="290" stroke="#999" stroke-dasharray="4,4"/>
  <text x="730" y="56" text-anchor="middle" fill="#666">NextCP pair</text>

  <!-- circuit labels -->
  <text x="200" y="168" text-anchor="middle" fill="#333">Corporal:1NAT</text>
  <text x="305" y="168" text-anchor="middle" fill="#333">Corporal:2NAT</text>
  <text x="400" y="168" text-anchor="middle" fill="#a0522d" font-size="11">Corporal:2NAT</text>
  <text x="400" y="180" text-anchor="middle" fill="#a0522d" font-size="10">(consumer row)</text>
  <text x="480" y="168" text-anchor="middle" fill="#333">Sargent:1SAT</text>
  <text x="685" y="168" text-anchor="middle" fill="#333">Sargent:1NAT</text>
  <text x="785" y="168" text-anchor="middle" fill="#a00">dark track</text>

  <!-- signals: a short mast and a triangle pointing the way it governs -->
  <g fill="#0a6" stroke="#0a6">
    <line x1="30" y1="150" x2="30" y2="128"/><path d="M30,122 l10,6 l-10,6 z"/>
    <line x1="150" y1="150" x2="150" y2="128"/><path d="M150,122 l-10,6 l10,6 z"/>
    <line x1="520" y1="150" x2="520" y2="128"/><path d="M520,122 l10,6 l-10,6 z"/>
    <line x1="640" y1="150" x2="640" y2="128"/><path d="M640,122 l-10,6 l10,6 z"/>
    <line x1="845" y1="150" x2="845" y2="128"/><path d="M845,122 l10,6 l-10,6 z"/>
    <line x1="925" y1="150" x2="925" y2="128"/><path d="M925,122 l-10,6 l10,6 z"/>
    <line x1="975" y1="150" x2="975" y2="128"/><path d="M975,122 l-10,6 l10,6 z"/>
  </g>
  <g fill="#063" font-weight="bold">
    <text x="36" y="116">830SAB</text>
    <text x="144" y="116" text-anchor="end">830NAB</text>
    <text x="526" y="116">836SA</text>
    <text x="634" y="116" text-anchor="end">836NAB</text>
    <text x="851" y="116">838SAB</text>
    <text x="925" y="100" text-anchor="middle">838NAB</text>
    <text x="972" y="86" text-anchor="middle">840NC</text>
  </g>
  <text x="885" y="142" fill="#333" font-size="10">837</text>

  <!-- next signal, southbound, above -->
  <path d="M36,100 C200,62 360,62 514,100" fill="none" stroke="#555" marker-end="url(#arr)"/>
  <path d="M526,100 C650,62 720,62 839,100" fill="none" stroke="#555" marker-end="url(#arr)"/>
  <text x="275" y="76" text-anchor="middle" fill="#444">next signal southbound</text>
  <text x="682" y="76" text-anchor="middle" fill="#444">next signal southbound</text>

  <!-- next signal, northbound, below -->
  <path d="M970,205 C960,222 940,222 928,207" fill="none" stroke="#555" marker-end="url(#arr)"/>
  <path d="M920,205 C820,250 720,250 644,207" fill="none" stroke="#555" marker-end="url(#arr)"/>
  <path d="M634,205 C480,262 300,262 156,207" fill="none" stroke="#555" marker-end="url(#arr)"/>
  <text x="395" y="262" text-anchor="middle" fill="#444">next signal northbound</text>
  <text x="782" y="250" text-anchor="middle" fill="#444">next signal northbound</text>

  <!-- block captions -->
  <g fill="#222">
    <text x="150" y="305" font-weight="bold">Station-to-station block Corporal to Sargent</text>
    <text x="150" y="321">Circuits Corporal:1NAT, Corporal:2NAT, Sargent:1SAT. RULE_261 stated at both ends.</text>
    <text x="150" y="337">Homes at its ends: 830NAB (Corporal), 836SA (Sargent).</text>
    <text x="150" y="353">Approach signals of 836SA, derived: 830SAB and 832SA. No automatic signal is drawn.</text>
    <text x="620" y="377" font-weight="bold">Station-to-station block Sargent to Watsonville</text>
    <text x="620" y="393">Circuit Sargent:1NAT and dark track. RULE_261 at Sargent only.</text>
    <text x="620" y="409">Approach signals of 838SAB, derived: 836SA and 836SB.</text>
  </g>

  <!-- inset: a double location -->
  <rect x="20" y="380" width="560" height="108" fill="#fafafa" stroke="#bbb"/>
  <text x="32" y="398" font-weight="bold" fill="#222">A double location (illustration only, not drawn in SPCoast)</text>
  <line x1="60" y1="450" x2="320" y2="450" stroke="#111" stroke-width="3"/>
  <line x1="190" y1="442" x2="190" y2="458" stroke="#111" stroke-width="2"/>
  <text x="120" y="472" text-anchor="middle" fill="#333">approach side</text>
  <text x="260" y="472" text-anchor="middle" fill="#333">governed side</text>
  <g fill="#0a6" stroke="#0a6">
    <line x1="190" y1="450" x2="190" y2="426"/><path d="M190,420 l10,6 l-10,6 z"/>
    <line x1="190" y1="450" x2="190" y2="476" stroke-dasharray="2,2"/><path d="M190,482 l-10,-6 l10,-6 z" />
  </g>
  <text x="206" y="428" fill="#063">mast that governs into the governed side</text>
  <text x="206" y="488" fill="#063">mast that governs into the approach side</text>
  <text x="340" y="440" fill="#222">One joint, two masts (D3):</text>
  <text x="340" y="456" fill="#222">relations.masts, keyed by the side</text>
  <text x="340" y="472" fill="#222">each mast governs into.</text>
</svg>
