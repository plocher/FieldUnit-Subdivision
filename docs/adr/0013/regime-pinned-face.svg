<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold">A regime marker pinned on a joint face (Watsonville staging track 1)</text>

  <!-- track 1 -->
  <g stroke-width="5">
    <line x1="40" y1="90" x2="108" y2="90" stroke="#1D9E75"/>
    <line x1="112" y1="90" x2="228" y2="90" stroke="#EF9F27"/>
    <line x1="232" y1="90" x2="348" y2="90" stroke="#EF9F27"/>
    <line x1="352" y1="90" x2="438" y2="90" stroke="#EF9F27"/>
    <line x1="442" y1="90" x2="538" y2="90" stroke="#EF9F27"/>
    <line x1="542" y1="90" x2="640" y2="90" stroke="#1D9E75"/>
  </g>
  <g stroke="#000" stroke-width="2">
    <line x1="110" y1="78" x2="110" y2="102"/>
    <line x1="230" y1="78" x2="230" y2="102"/>
    <line x1="350" y1="78" x2="350" y2="102"/>
    <line x1="440" y1="78" x2="440" y2="102"/>
    <line x1="540" y1="74" x2="540" y2="102" stroke-width="3"/>
  </g>
  <!-- markers -->
  <g stroke="#000" stroke-width="1">
    <line x1="75" y1="68" x2="75" y2="87"/>
    <line x1="170" y1="68" x2="170" y2="87"/>
    <line x1="590" y1="68" x2="590" y2="87"/>
  </g>
  <rect x="55" y="48" width="40" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="75" y="62" text-anchor="middle" fill="#085041">CTC</text>
  <rect x="150" y="48" width="40" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="170" y="62" text-anchor="middle" fill="#633806">6.13</text>
  <rect x="570" y="48" width="40" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="590" y="62" text-anchor="middle" fill="#085041">CTC</text>
  <!-- labels -->
  <g text-anchor="middle" fill="#444">
    <text x="75" y="120">25.R stub</text>
    <text x="170" y="120">1BT</text>
    <text x="290" y="120">1CT</text>
    <text x="395" y="120">1DT</text>
    <text x="490" y="120">1ET</text>
    <text x="590" y="120">3.N stub</text>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="13">
    <text x="110" y="142">J1</text>
    <text x="230" y="142">J2</text>
    <text x="350" y="142">J3</text>
    <text x="440" y="142">J4</text>
    <text x="540" y="142">S (signal joint)</text>
  </g>
  <g text-anchor="middle" fill="#444">
    <text x="110" y="160">pinned</text>
    <text x="230" y="160">passes</text>
    <text x="350" y="160">passes</text>
    <text x="440" y="160">passes</text>
    <text x="540" y="160">pinned</text>
  </g>
  <g stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="180" y1="180" x2="526" y2="180"/>
    <line x1="160" y1="180" x2="124" y2="180"/>
  </g>
  <path d="M520 175 L530 180 L520 185" fill="none" stroke="#BA7517" stroke-width="1.5"/>
  <path d="M130 175 L120 180 L130 185" fill="none" stroke="#BA7517" stroke-width="1.5"/>
  <text x="355" y="198" text-anchor="middle" fill="#444">6.13 spreads from 1BT both ways and stops at each pinned joint</text>

  <!-- three cases -->
  <g fill="#F1EFE8" stroke="#888780">
    <rect x="40" y="218" width="190" height="150" rx="10"/>
    <rect x="245" y="218" width="190" height="150" rx="10"/>
    <rect x="450" y="218" width="190" height="150" rx="10"/>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="13" fill="#2C2C2A">
    <text x="135" y="242">Both faces pinned</text>
    <text x="340" y="242">Neither face pinned</text>
    <text x="545" y="242">One face pinned</text>
  </g>
  <!-- case 1 -->
  <line x1="65" y1="300" x2="133" y2="300" stroke="#1D9E75" stroke-width="5"/>
  <line x1="137" y1="300" x2="205" y2="300" stroke="#EF9F27" stroke-width="5"/>
  <line x1="135" y1="288" x2="135" y2="312" stroke="#000" stroke-width="2"/>
  <circle cx="62" cy="300" r="4"/><circle cx="208" cy="300" r="4"/>
  <line x1="95" y1="280" x2="95" y2="297" stroke="#000"/><line x1="175" y1="280" x2="175" y2="297" stroke="#000"/>
  <rect x="75" y="260" width="40" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="95" y="274" text-anchor="middle" fill="#085041">CTC</text>
  <rect x="155" y="260" width="40" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="175" y="274" text-anchor="middle" fill="#633806">6.13</text>
  <!-- case 2 -->
  <line x1="272" y1="300" x2="338" y2="300" stroke="#EF9F27" stroke-width="5"/>
  <line x1="342" y1="300" x2="408" y2="300" stroke="#EF9F27" stroke-width="5"/>
  <g stroke="#000" stroke-width="2">
    <line x1="270" y1="288" x2="270" y2="312"/><line x1="340" y1="288" x2="340" y2="312"/><line x1="410" y1="288" x2="410" y2="312"/>
  </g>
  <line x1="305" y1="280" x2="305" y2="297" stroke="#000"/>
  <rect x="285" y="260" width="40" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="305" y="274" text-anchor="middle" fill="#633806">6.13</text>
  <!-- case 3 -->
  <line x1="475" y1="300" x2="543" y2="300" stroke="#1D9E75" stroke-width="5"/>
  <line x1="547" y1="300" x2="613" y2="300" stroke="#EF9F27" stroke-width="5"/>
  <g stroke="#000" stroke-width="2">
    <line x1="545" y1="288" x2="545" y2="312"/><line x1="615" y1="288" x2="615" y2="312"/>
  </g>
  <circle cx="472" cy="300" r="4"/>
  <line x1="505" y1="280" x2="505" y2="297" stroke="#000"/>
  <rect x="485" y="260" width="40" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="505" y="274" text-anchor="middle" fill="#085041">CTC</text>
  <g text-anchor="middle" fill="#444">
    <text x="135" y="330">e.g. Gilroy Caltrain 03T</text>
    <text x="340" y="330">e.g. J2, J3, J4</text>
    <text x="545" y="330">e.g. J1 and S</text>
  </g>
  <g text-anchor="middle" fill="#2C2C2A">
    <text x="135" y="352">joint passes nothing</text>
    <text x="340" y="352">regime flows across</text>
    <text x="545" y="352">joint passes nothing</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="400" x2="70" y2="400" stroke="#1D9E75" stroke-width="5"/><text x="78" y="404">GCOR 10.0 (CTC)</text>
  <line x1="190" y1="400" x2="220" y2="400" stroke="#EF9F27" stroke-width="5"/><text x="228" y="404">GCOR 6.13 (Yard Limits)</text>
  <line x1="388" y1="390" x2="388" y2="410" stroke="#000" stroke-width="2"/><text x="396" y="404">joint</text>
  <circle cx="448" cy="400" r="4"/><text x="458" y="404">stub end (switch leg, end of track)</text>
  <text x="40" y="428" fill="#444">A face is pinned when a marker's net touches that joint and no other joint. Any pinned face: the joint passes no regime.</text>
</svg>
