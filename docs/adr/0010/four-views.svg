<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="720" viewBox="0 0 1560 720"><title>ADR 0010: the four views from one geometry object</title><style>
  text { font-family: Helvetica, Arial, sans-serif; }
  .t { font-size: 12px; fill: #222; }
  .s { font-size: 10px; fill: #555; }
  .h { font-size: 15px; font-weight: bold; fill: #111; }
  .track { stroke: #222; stroke-width: 2.5; fill: none; }
  .dark { stroke: #999; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
  .frame { stroke: #c33; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  .glyph { stroke: #06c; stroke-width: 1.5; fill: none; }
  .port { fill: #06c; }
  .house { stroke: #a60; stroke-width: 1.5; fill: #fff3d6; }
  .marker { stroke: #393; stroke-width: 1.5; fill: #fff; }
  .mk { font-size: 9px; fill: #393; font-weight: bold; }
  .lamp { stroke: #222; stroke-width: 1.2; fill: #fff; }
  .route { stroke: #d22; stroke-width: 7; fill: none; opacity: .5; stroke-linecap: round; stroke-linejoin: round; }
  .panel { stroke: #bbb; fill: #fff; }
</style><rect width="100%" height="100%" fill="white"/><g transform="translate(10,10)"><rect class="panel" width="760" height="340"/><text class="h" x="12" y="24">1. Thinline: the main track as one line</text><text class="s" x="12" y="42">keeps: rows whose circuit stands under a Rule 261 sign, closed into one line; the circuits' lamps; the masts that govern it;</text><text class="s" x="12" y="55">the NextCP ends. drops: the siding (Rule 105) and its mast, dark track, the switch, every joint, the house.</text><g transform="translate(70,100) scale(0.6)"><polyline class="track" points="0.0,264.2 965.2,264.2"/><circle class="lamp" cx="132.1" cy="264.2" r="5"/><text class="s" x="132" y="255" text-anchor="middle">Corporal:2NAT</text><circle class="lamp" cx="406.4" cy="264.2" r="5"/><text class="s" x="406" y="255" text-anchor="middle">1SAT</text><circle class="lamp" cx="853.4" cy="264.2" r="5"/><text class="s" x="853" y="255" text-anchor="middle">1NAT</text><line class="glyph" x1="477.5" y1="294.6" x2="477.5" y2="306.6"/><circle class="glyph" cx="486.5" cy="306.6" r="5"/><text class="s" x="478" y="327" text-anchor="middle">836SA</text><line class="glyph" x1="731.5" y1="233.7" x2="731.5" y2="221.7"/><circle class="glyph" cx="722.5" cy="221.7" r="5"/><circle class="glyph" cx="711.5" cy="221.7" r="5"/><text class="s" x="732" y="208" text-anchor="middle">836NAB</text><text class="t" x="973" y="268" text-anchor="start">to Watsonville</text><text class="t" x="-8" y="268" text-anchor="end">to Corporal</text></g></g><g transform="translate(790,10)"><rect class="panel" width="760" height="340"/><text class="h" x="12" y="24">2. Model board: every placement, with the board's own glyphs</text><text class="s" x="12" y="42">keeps: every row, switch legs and joint ticks at their placements, a lamp at each circuit's placement, masts with their</text><text class="s" x="12" y="55">heads, the house. styles: the board's.</text><g transform="translate(70,100) scale(0.6)"><polyline class="track" points="741.7,264.2 965.2,264.2"/><polyline class="track" points="345.4,132.1 467.4,132.1"/><polyline class="track" points="223.5,264.2 467.4,264.2"/><polyline class="track" points="0.0,264.2 203.2,264.2"/><polyline class="track" points="721.4,264.2 487.7,264.2"/><polyline class="track" points="721.4,264.2 629.9,264.2 487.7,132.1"/><text class="s" x="630" y="282" text-anchor="middle">835</text><polyline class="dark" points="325.1,132.1 91.4,132.1"/><polyline class="dark" points="325.1,132.1 233.7,132.1 91.4,0.0"/><text class="s" x="234" y="150" text-anchor="middle">1</text><line class="marker" x1="731.5" y1="258.2" x2="731.5" y2="270.2"/><line class="marker" x1="213.4" y1="258.2" x2="213.4" y2="270.2"/><line class="marker" x1="477.5" y1="258.2" x2="477.5" y2="270.2"/><line class="marker" x1="477.5" y1="126.1" x2="477.5" y2="138.1"/><text class="s" x="335" y="123" text-anchor="middle">END CTC</text><circle class="lamp" cx="132.1" cy="264.2" r="5"/><text class="s" x="132" y="255" text-anchor="middle">Corporal:2NAT</text><circle class="lamp" cx="406.4" cy="264.2" r="5"/><text class="s" x="406" y="255" text-anchor="middle">1SAT</text><circle class="lamp" cx="386.1" cy="132.1" r="5"/><text class="s" x="386" y="123" text-anchor="middle">2SAT</text><circle class="lamp" cx="853.4" cy="264.2" r="5"/><text class="s" x="853" y="255" text-anchor="middle">1NAT</text><line class="glyph" x1="477.5" y1="162.6" x2="477.5" y2="174.6"/><circle class="glyph" cx="486.5" cy="174.6" r="5"/><text class="s" x="478" y="195" text-anchor="middle">836SB</text><line class="glyph" x1="477.5" y1="294.6" x2="477.5" y2="306.6"/><circle class="glyph" cx="486.5" cy="306.6" r="5"/><text class="s" x="478" y="327" text-anchor="middle">836SA</text><line class="glyph" x1="731.5" y1="233.7" x2="731.5" y2="221.7"/><circle class="glyph" cx="722.5" cy="221.7" r="5"/><circle class="glyph" cx="711.5" cy="221.7" r="5"/><text class="s" x="732" y="208" text-anchor="middle">836NAB</text><rect class="house" x="717.52" y="-9.0" width="28" height="18"/><text class="s" x="732" y="-13" text-anchor="middle">CP Sargent</text><text class="t" x="973" y="268" text-anchor="start">to Watsonville</text><text class="t" x="-8" y="268" text-anchor="end">to Corporal</text></g></g><g transform="translate(10,370)"><rect class="panel" width="760" height="340"/><text class="h" x="12" y="24">3. Route finder: the board plus an evaluated route</text><text class="s" x="12" y="42">836NB: 1NAT, 835 reverse, 2SAT, laid over the same rows and legs. The route is the evaluator's (view §5); geometry only says</text><text class="s" x="12" y="55">where to paint it.</text><g transform="translate(70,100) scale(0.6)"><polyline class="track" points="741.7,264.2 965.2,264.2"/><polyline class="track" points="345.4,132.1 467.4,132.1"/><polyline class="track" points="223.5,264.2 467.4,264.2"/><polyline class="track" points="0.0,264.2 203.2,264.2"/><polyline class="track" points="721.4,264.2 487.7,264.2"/><polyline class="track" points="721.4,264.2 629.9,264.2 487.7,132.1"/><text class="s" x="630" y="282" text-anchor="middle">835</text><polyline class="dark" points="325.1,132.1 91.4,132.1"/><polyline class="dark" points="325.1,132.1 233.7,132.1 91.4,0.0"/><text class="s" x="234" y="150" text-anchor="middle">1</text><line class="marker" x1="731.5" y1="258.2" x2="731.5" y2="270.2"/><line class="marker" x1="213.4" y1="258.2" x2="213.4" y2="270.2"/><line class="marker" x1="477.5" y1="258.2" x2="477.5" y2="270.2"/><line class="marker" x1="477.5" y1="126.1" x2="477.5" y2="138.1"/><text class="s" x="335" y="123" text-anchor="middle">END CTC</text><polyline class="route" points="965.2,264.2 721.4,264.2"/><polyline class="route" points="721.4,264.2 629.9,264.2 487.7,132.1"/><polyline class="route" points="487.7,132.1 345.4,132.1"/><circle class="lamp" cx="132.1" cy="264.2" r="5"/><text class="s" x="132" y="255" text-anchor="middle">Corporal:2NAT</text><circle class="lamp" cx="406.4" cy="264.2" r="5"/><text class="s" x="406" y="255" text-anchor="middle">1SAT</text><circle class="lamp" cx="386.1" cy="132.1" r="5"/><text class="s" x="386" y="123" text-anchor="middle">2SAT</text><circle class="lamp" cx="853.4" cy="264.2" r="5"/><text class="s" x="853" y="255" text-anchor="middle">1NAT</text><line class="glyph" x1="477.5" y1="162.6" x2="477.5" y2="174.6"/><circle class="glyph" cx="486.5" cy="174.6" r="5"/><text class="s" x="478" y="195" text-anchor="middle">836SB</text><line class="glyph" x1="477.5" y1="294.6" x2="477.5" y2="306.6"/><circle class="glyph" cx="486.5" cy="306.6" r="5"/><text class="s" x="478" y="327" text-anchor="middle">836SA</text><line class="glyph" x1="731.5" y1="233.7" x2="731.5" y2="221.7"/><circle class="glyph" cx="722.5" cy="221.7" r="5"/><circle class="glyph" cx="711.5" cy="221.7" r="5"/><text class="s" x="732" y="208" text-anchor="middle">836NAB</text><rect class="house" x="717.52" y="-9.0" width="28" height="18"/><text class="s" x="732" y="-13" text-anchor="middle">CP Sargent</text><text class="t" x="973" y="268" text-anchor="start">to Watsonville</text><text class="t" x="-8" y="268" text-anchor="end">to Corporal</text></g></g><g transform="translate(790,370)"><rect class="panel" width="760" height="340"/><text class="h" x="12" y="24">4. Documentation packet: the board at print scale beside its tables</text><text class="s" x="12" y="42">the picture generator's board, re-targeted to the file, printed with the appliance, device and binding tables the packet</text><text class="s" x="12" y="55">already lists.</text><g transform="translate(20,110) scale(0.36)"><polyline class="track" points="741.7,264.2 965.2,264.2"/><polyline class="track" points="345.4,132.1 467.4,132.1"/><polyline class="track" points="223.5,264.2 467.4,264.2"/><polyline class="track" points="0.0,264.2 203.2,264.2"/><polyline class="track" points="721.4,264.2 487.7,264.2"/><polyline class="track" points="721.4,264.2 629.9,264.2 487.7,132.1"/><text class="s" x="630" y="282" text-anchor="middle">835</text><polyline class="dark" points="325.1,132.1 91.4,132.1"/><polyline class="dark" points="325.1,132.1 233.7,132.1 91.4,0.0"/><text class="s" x="234" y="150" text-anchor="middle">1</text><line class="marker" x1="731.5" y1="258.2" x2="731.5" y2="270.2"/><line class="marker" x1="213.4" y1="258.2" x2="213.4" y2="270.2"/><line class="marker" x1="477.5" y1="258.2" x2="477.5" y2="270.2"/><line class="marker" x1="477.5" y1="126.1" x2="477.5" y2="138.1"/><text class="s" x="335" y="123" text-anchor="middle">END CTC</text><circle class="lamp" cx="132.1" cy="264.2" r="5"/><text class="s" x="132" y="255" text-anchor="middle">Corporal:2NAT</text><circle class="lamp" cx="406.4" cy="264.2" r="5"/><text class="s" x="406" y="255" text-anchor="middle">1SAT</text><circle class="lamp" cx="386.1" cy="132.1" r="5"/><text class="s" x="386" y="123" text-anchor="middle">2SAT</text><circle class="lamp" cx="853.4" cy="264.2" r="5"/><text class="s" x="853" y="255" text-anchor="middle">1NAT</text><line class="glyph" x1="477.5" y1="162.6" x2="477.5" y2="174.6"/><circle class="glyph" cx="486.5" cy="174.6" r="5"/><text class="s" x="478" y="195" text-anchor="middle">836SB</text><line class="glyph" x1="477.5" y1="294.6" x2="477.5" y2="306.6"/><circle class="glyph" cx="486.5" cy="306.6" r="5"/><text class="s" x="478" y="327" text-anchor="middle">836SA</text><line class="glyph" x1="731.5" y1="233.7" x2="731.5" y2="221.7"/><circle class="glyph" cx="722.5" cy="221.7" r="5"/><circle class="glyph" cx="711.5" cy="221.7" r="5"/><text class="s" x="732" y="208" text-anchor="middle">836NAB</text><rect class="house" x="717.52" y="-9.0" width="28" height="18"/><text class="s" x="732" y="-13" text-anchor="middle">CP Sargent</text><text class="t" x="973" y="268" text-anchor="start">to Watsonville</text><text class="t" x="-8" y="268" text-anchor="end">to Corporal</text></g><g transform="translate(450,110)"><text class="t" x="0" y="0">appliances (placement excerpt)</text><text class="s" x="0" y="18">835 at 78.74, 33.0