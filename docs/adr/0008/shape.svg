<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="640" fill="#ffffff"/>
  <title>The Layout Data Model File: one file, facts by scope, relations by name</title>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b00000"/></marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#333">One file, facts by scope, relations by name</text>
  <text x="20" y="50" fill="#555">Boxes: the scopes a person can see. Yellow: declarations. White: what attaches, with its own address. Red dashed: a reference by qualified name.</text>

  <!-- file -->
  <rect x="20" y="70" width="960" height="550" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="36" y="92" font-weight="bold" fill="#333">SPCoast.layout.json</text>
  <text x="200" y="92" fill="#555" font-size="12">schema: layout-model/v2.0.0    provenance: source type, compiler, the one source (the project), libraries, reference data versions</text>

  <!-- layout scope -->
  <rect x="40" y="106" width="920" height="150" rx="8" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="54" y="126" font-weight="bold" fill="#333">layout</text>
  <text x="110" y="126" fill="#555" font-size="12">name, railroad, division, settings (era, rulebook). Entities named once for the whole layout:</text>
  <rect x="54" y="138" width="190" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="64" y="156" fill="#333">transports.CMRInet</text>
  <text x="64" y="172" fill="#555" font-size="11">kind, port, baud, host</text>
  <text x="64" y="183" fill="#555" font-size="11">declares the line</text>
  <rect x="254" y="138" width="150" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="264" y="156" fill="#333">transports.MQTT</text>
  <text x="264" y="172" fill="#555" font-size="11">broker, topic, host</text>
  <rect x="414" y="138" width="150" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="424" y="156" fill="#333">codelines</text>
  <text x="424" y="172" fill="#555" font-size="11">AAR Tokens@MQTT</text>
  <text x="424" y="183" fill="#555" font-size="11">encoding on transport</text>

  <rect x="54" y="202" width="180" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="64" y="218" fill="#333">processors.Sargent</text>
  <text x="64" y="232" fill="#555" font-size="11">field; cpNode Xiao; chips 0x20,</text>
  <text x="64" y="245" fill="#555" font-size="11">0x40/pwm, 0x40/servo</text>
  <rect x="244" y="202" width="150" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="254" y="218" fill="#333">processors.Luchessa</text>
  <text x="254" y="232" fill="#555" font-size="11">field; cpNode Xiao</text>
  <text x="254" y="245" fill="#555" font-size="11">chips 0x20, 0x21 MCP23017</text>
  <rect x="404" y="202" width="150" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="414" y="218" fill="#333">processors.Corporal</text>
  <text x="414" y="232" fill="#555" font-size="11">field; cpNode Xiao</text>
  <text x="414" y="245" fill="#555" font-size="11">chips 0x20 MCP23017</text>
  <rect x="580" y="138" width="190" height="110" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="590" y="156" fill="#333">processors.Caltrain</text>
  <text x="590" y="172" fill="#555" font-size="11">field; board cpNode</text>
  <text x="590" y="186" fill="#555" font-size="11">transport CMRInet; address 30</text>
  <text x="590" y="204" fill="#555" font-size="11">attaches to the line by its UA,</text>
  <text x="590" y="218" fill="#555" font-size="11">declares the node's bits (chip CMRI)</text>
  <path d="M 580 182 C 520 199, 300 199, 244 182" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="786" y="138" width="164" height="110" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="796" y="156" fill="#333" font-size="12">processors."SPCoast South"</text>
  <text x="796" y="172" fill="#555" font-size="11">office; ESP32</text>
  <text x="796" y="186" fill="#555" font-size="11">chips 0x2C MAX7313</text>
  <text x="796" y="214" fill="#555" font-size="11">Luchessa/0x20, Corporal/0x20:</text>
  <text x="796" y="228" fill="#555" font-size="11">one address, two chips,</text>
  <text x="796" y="242" fill="#555" font-size="11">no clash</text>

  <!-- interlocking Sargent -->
  <rect x="40" y="270" width="300" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="54" y="290" font-weight="bold" fill="#333">interlockings.Sargent</text>
  <text x="54" y="312" fill="#333" font-size="11">controlPoints, appliances (835, 836NAB…), track</text>
  <text x="54" y="328" fill="#333" font-size="11">settings; codelines [AAR Tokens@MQTT]</text>
  <rect x="54" y="340" width="270" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="64" y="361" fill="#333">fieldUnit.host: Sargent</text>
  <path d="M 150 340 C 150 300, 140 270, 140 250" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="54" y="386" width="270" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="64" y="404" fill="#333">devices[]  a row: serves Sargent:835</text>
  <text x="64" y="420" fill="#555" font-size="11">type switch/lock; bindings:</text>
  <text x="64" y="435" fill="#555" font-size="11">M → chip Sargent/0x20 pin B1, N → B2 …</text>
  <text x="64" y="450" fill="#555" font-size="11">a chip pin is the attachment's address;</text>
  <text x="64" y="465" fill="#555" font-size="11">a row has no identity</text>
  <text x="54" y="496" fill="#333" font-size="12">geometry: placements, track polylines</text>
  <path d="M 230 386 C 260 330, 260 290, 210 250" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- interlocking Caltrain -->
  <rect x="356" y="270" width="300" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="370" y="290" font-weight="bold" fill="#333">interlockings."Gilroy Caltrain"</text>
  <text x="370" y="312" fill="#333" font-size="12">controlPoints, appliances (773, 774NAB), track, settings</text>
  <rect x="370" y="340" width="270" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="361" fill="#333">fieldUnit.host: Caltrain</text>
  <path d="M 600 340 C 600 300, 640 270, 650 248" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="370" y="386" width="270" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="404" fill="#333">devices[]  serves Gilroy Caltrain:774NAB</text>
  <text x="380" y="420" fill="#555" font-size="11">bindings: LAMP → chip Caltrain/CMRI pin OUT.7</text>
  <text x="380" y="435" fill="#555" font-size="11">no row names the transport or the UA</text>
  <path d="M 630 386 C 660 330, 700 290, 700 248" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- machine -->
  <rect x="672" y="270" width="288" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="686" y="290" font-weight="bold" fill="#333">machines."SPCoast South"</text>
  <text x="686" y="312" fill="#333" font-size="12">panelStyle, columns{13: Sargent}, attachments[]</text>
  <rect x="686" y="340" width="260" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="696" y="361" fill="#333">officeUnit.host: SPCoast South</text>
  <path d="M 900 340 C 900 300, 880 270, 870 248" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="686" y="386" width="260" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="696" y="404" fill="#333">devices[]  column SPCoast South:13</text>
  <text x="696" y="420" fill="#555" font-size="11">lever/lock serves Sargent:835</text>
  <text x="696" y="435" fill="#555" font-size="11">bindings: WLS → SPCoast South/0x2C pin A7</text>
  <text x="696" y="450" fill="#555" font-size="11">every reference is a qualified name</text>
  <path d="M 760 472 L 760 506 L 340 506 L 340 430 L 326 430" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="430" y="501" fill="#b00000" font-size="11">serves Sargent:835: the same form in any scope</text>

  <text x="40" y="548" fill="#333" font-size="12" font-weight="bold">What is not in the file</text>
  <text x="40" y="566" fill="#555" font-size="12">sheets, nets, references, units (source-isms); diagnostics (an error means no file; absence is read from the file); routes, signals, tokens,</text>
  <text x="40" y="582" fill="#555" font-size="12">casts, resolved settings (the evaluator derives them in memory); the libraries and the reference data (named by key and version, never copied);</text>
  <text x="40" y="598" fill="#555" font-size="12">any order in a list (every intended order is an explicit address or key).</text>
</svg>
