<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="640" fill="#ffffff"/>
  <title>The Layout Data Model File on the cTc interface layers: office, Seam 1 codeline, field; Seam 2 hardware I/O on each side; the transport catalog</title>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b00000"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>

  <!-- file -->
  <rect x="20" y="10" width="960" height="620" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="36" y="32" font-weight="bold" fill="#333">SPCoast.layout.json</text>
  <text x="200" y="32" fill="#555" font-size="12">schema: layout-model/v2.0.0    provenance: source type, compiler, the one source (the project), libraries, reference data versions</text>

  <!-- ===== OFFICE band: machines."SPCoast South" ===== -->
  <rect x="56" y="48" width="648" height="190" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="68" y="68" font-weight="bold" fill="#333">OFFICE</text>
  <text x="130" y="68" fill="#333" font-size="12">machines."SPCoast South": panelStyle, columns{13: Sargent}, settings, geometry</text>

  <text x="68" y="88" fill="#777" font-size="10">PANEL DEVICES</text>
  <rect x="68" y="92" width="380" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="109" fill="#333" font-size="12">devices[]  a row: lever/lock, column SPCoast South:13, serves Sargent:835</text>
  <text x="78" y="126" fill="#555" font-size="11">bindings: WLS → chip SPCoast South/0x2C pin A7</text>

  <text x="68" y="154" fill="#777" font-size="10">PANEL I/O  ·  SEAM 2, panel side</text>
  <rect x="68" y="158" width="300" height="34" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="78" y="172" fill="#333" font-size="11">Local I/O: layout.processors."SPCoast South"</text>
  <text x="78" y="186" fill="#555" font-size="11">office; ESP32; chips 0x2C MAX7313</text>
  <path d="M 300 136 L 300 158" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <text x="68" y="210" fill="#777" font-size="10">OFFICE LOGIC  ·  the cTc code machine</text>
  <rect x="68" y="214" width="300" height="18" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="227" fill="#333" font-size="12">officeUnit.host: SPCoast South</text>
  <path d="M 340 214 L 340 192" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="380" y="214" width="312" height="18" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="227" fill="#333" font-size="10">attachments[] (office end): 13 → Sargent over AAR Tokens@MQTT</text>

  <!-- ===== SEAM 1 band: layout.codelines ===== -->
  <polygon points="68,252 680,252 692,276 680,300 68,300 56,276" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="76" y="270" font-weight="bold" fill="#333">SEAM 1  ·  Codeline</text>
  <text x="76" y="290" fill="#555" font-size="11">controls ▼ indications ▲   layout.codelines{}: an encoding on a transport</text>
  <rect x="440" y="258" width="232" height="36" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="273" fill="#333" font-size="12">codelines."AAR Tokens@MQTT"</text>
  <text x="450" y="288" fill="#555" font-size="11">encoding AAR; transport MQTT</text>
  <path d="M 556 232 L 556 258" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#b)"/>
  <path d="M 672 282 L 740 282" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- ===== FIELD band: interlockings ===== -->
  <rect x="56" y="314" width="648" height="304" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="68" y="334" font-weight="bold" fill="#333">FIELD</text>
  <text x="120" y="334" fill="#333" font-size="12">interlockings{}: one per location. controlPoints, appliances, track, settings, geometry</text>

  <!-- Sargent column -->
  <text x="68" y="354" fill="#333" font-size="12" font-weight="bold">interlockings.Sargent</text>
  <text x="68" y="372" fill="#777" font-size="10">FIELD LOGIC</text>
  <rect x="68" y="376" width="190" height="18" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="389" fill="#333" font-size="12">fieldUnit.host: Sargent</text>
  <rect x="268" y="376" width="200" height="18" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="278" y="389" fill="#333" font-size="12">codelines[]: a station on the line</text>
  <path d="M 368 376 L 368 306 L 460 306 L 460 294" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#b)"/>
  <text x="300" y="312" fill="#1f5fbf" font-size="10">field end</text>

  <text x="68" y="416" fill="#777" font-size="10">FIELD I/O  ·  SEAM 2, field side</text>
  <rect x="68" y="420" width="205" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="78" y="435" fill="#333" font-size="11">Local I/O: layout.processors.Sargent</text>
  <text x="78" y="449" fill="#555" font-size="11">field; cpNode Xiao; chips 0x20,</text>
  <text x="78" y="462" fill="#555" font-size="11">0x40/pwm, 0x40/servo</text>
  <path d="M 240 394 L 240 420" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="283" y="420" width="185" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="293" y="435" fill="#333" font-size="11">Local I/O: layout.processors</text>
  <text x="293" y="449" fill="#555" font-size="11">.Luchessa, .Corporal: each chip 0x20;</text>
  <text x="293" y="462" fill="#555" font-size="11">one address, two chips, no clash</text>

  <text x="68" y="490" fill="#777" font-size="10">FIELD DEVICES</text>
  <rect x="68" y="494" width="400" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="511" fill="#333" font-size="12">devices[]  a row: switch/lock, serves Sargent:835</text>
  <text x="78" y="527" fill="#555" font-size="11">bindings: M → chip Sargent/0x20 pin B1, N → B2 …</text>
  <text x="78" y="543" fill="#555" font-size="11">a chip pin is the attachment's address; a row has no identity</text>
  <path d="M 230 494 L 230 468" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- Caltrain column -->
  <text x="490" y="354" fill="#333" font-size="12" font-weight="bold">interlockings."Gilroy Caltrain"</text>
  <rect x="486" y="376" width="210" height="18" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="496" y="389" fill="#333" font-size="12">fieldUnit.host: Caltrain</text>
  <rect x="486" y="420" width="210" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="496" y="435" fill="#333" font-size="11">Remote I/O node: layout.processors</text>
  <text x="496" y="449" fill="#555" font-size="11">.Caltrain: cpNode; CMRInet address 30</text>
  <text x="496" y="462" fill="#555" font-size="11">declares the node's bits (chip CMRI)</text>
  <path d="M 590 394 L 590 420" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <path d="M 696 440 L 740 440" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="486" y="494" width="210" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="496" y="509" fill="#333" font-size="11">devices[]  a row: head, serves</text>
  <text x="496" y="523" fill="#333" font-size="11">Gilroy Caltrain:774NAB</text>
  <text x="496" y="537" fill="#555" font-size="11">LAMP → chip Caltrain/CMRI pin OUT.7</text>
  <text x="496" y="550" fill="#555" font-size="11">no row names the transport or the UA</text>
  <path d="M 590 494 L 590 468" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- serves Sargent:835 from the office row, down the gutter -->
  <path d="M 68 114 L 44 114 L 44 520 L 68 520" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="68" y="580" fill="#b00000" font-size="10">the lever serves Sargent:835 by name, from the office band to the field band: the same form in any scope. The path it travels is derived (blue).</text>
  <text x="68" y="604" fill="#555" font-size="11">geometry: placements, track polylines</text>

  <!-- ===== TRANSPORT CATALOG: layout.transports ===== -->
  <rect x="740" y="48" width="224" height="570" rx="8" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="752" y="68" font-weight="bold" fill="#333">TRANSPORT CATALOG</text>
  <text x="752" y="86" fill="#555" font-size="11">layout.transports{}: this layout's instances</text>
  <text x="752" y="100" fill="#555" font-size="11">of the kinds in the reference data</text>
  <rect x="752" y="262" width="200" height="40" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="762" y="278" fill="#333" font-size="12">transports.MQTT</text>
  <text x="762" y="293" fill="#555" font-size="11">kind MQTT; broker, topic</text>
  <text x="752" y="318" fill="#b00000" font-size="10">← Seam 1 binding: transport, by name</text>
  <rect x="752" y="420" width="200" height="40" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="762" y="436" fill="#333" font-size="12">transports.CMRInet</text>
  <text x="762" y="451" fill="#555" font-size="11">kind CMRI; port, baud, host</text>
  <text x="752" y="476" fill="#b00000" font-size="10">← Seam 2 binding: the node on the line</text>
  <text x="752" y="506" fill="#555" font-size="11">Kinds (reference data): DC pulses,</text>
  <text x="752" y="520" fill="#555" font-size="11">MQTT, LocoNet, CMRInet, other IoT,</text>
  <text x="752" y="534" fill="#555" font-size="11">virtual/in-process.</text>
  <text x="752" y="554" fill="#555" font-size="11">Any transport can be bound to any</text>
  <text x="752" y="568" fill="#555" font-size="11">seam: a code line binds one to Seam 1,</text>
  <text x="752" y="582" fill="#555" font-size="11">a remote I/O node binds one to Seam 2.</text>
  <text x="752" y="596" fill="#555" font-size="11">The seam is derived, never written.</text>
</svg>
