<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="492" fill="#ffffff"/>
  <title>The Layout Data Model File: one file, facts by scope, relations by name</title>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b00000"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>

  <!-- file -->
  <rect x="20" y="10" width="960" height="472" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="36" y="32" font-weight="bold" fill="#333">SPCoast.layout.json</text>
  <text x="200" y="32" fill="#555" font-size="12">schema: layout-model/v2.0.0    provenance: source type, compiler, the one source (the project), libraries, reference data versions</text>

  <!-- layout scope -->
  <rect x="40" y="44" width="920" height="162" rx="8" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="54" y="64" font-weight="bold" fill="#333">layout</text>
  <text x="110" y="64" fill="#555" font-size="12">name, railroad, division, settings (era, rulebook). Entities named once for the whole layout:</text>

  <!-- row 1: transports, codelines -->
  <rect x="54" y="74" width="190" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="64" y="92" fill="#333">transports.CMRInet</text>
  <text x="64" y="106" fill="#555" font-size="11">kind, port, baud, host</text>
  <text x="64" y="118" fill="#555" font-size="11">declares the line</text>
  <rect x="254" y="74" width="150" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="264" y="92" fill="#333">transports.MQTT</text>
  <text x="264" y="106" fill="#555" font-size="11">broker, topic, host</text>
  <rect x="414" y="74" width="150" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="424" y="92" fill="#333">codelines</text>
  <text x="424" y="106" fill="#555" font-size="11">AAR Tokens@MQTT</text>
  <text x="424" y="118" fill="#555" font-size="11">encoding on transport</text>

  <!-- row 2: processors -->
  <rect x="54" y="146" width="160" height="52" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="64" y="163" fill="#333">processors.Sargent</text>
  <text x="64" y="177" fill="#555" font-size="11">field; cpNode Xiao; chips</text>
  <text x="64" y="191" fill="#555" font-size="11">0x20, 0x40/pwm, 0x40/servo</text>
  <rect x="224" y="146" width="160" height="52" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="234" y="163" fill="#333">processors.Luchessa</text>
  <text x="234" y="177" fill="#555" font-size="11">field; cpNode Xiao</text>
  <text x="234" y="191" fill="#555" font-size="11">chips 0x20, 0x21 MCP23017</text>
  <rect x="394" y="146" width="160" height="52" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="404" y="163" fill="#333">processors.Corporal</text>
  <text x="404" y="177" fill="#555" font-size="11">field; cpNode Xiao</text>
  <text x="404" y="191" fill="#555" font-size="11">chips 0x20 MCP23017</text>
  <rect x="564" y="146" width="190" height="52" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="574" y="163" fill="#333">processors.Caltrain</text>
  <text x="574" y="177" fill="#555" font-size="11">field; cpNode; CMRInet address 30</text>
  <text x="574" y="191" fill="#555" font-size="11">declares the node's bits (chip CMRI)</text>
  <rect x="764" y="146" width="182" height="52" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="774" y="163" fill="#333" font-size="12">processors."SPCoast South"</text>
  <text x="774" y="177" fill="#555" font-size="11">office; ESP32</text>
  <text x="774" y="191" fill="#555" font-size="11">chips 0x2C MAX7313</text>
  <!-- Caltrain attaches to CMRInet by name: along the lane between the rows -->
  <path d="M 590 146 C 570 128, 240 128, 200 122" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="250" y="138" fill="#b00000" font-size="11">transport, by name</text>

  <!-- interlocking Sargent -->
  <rect x="40" y="220" width="300" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="54" y="240" font-weight="bold" fill="#333">interlockings.Sargent</text>
  <text x="54" y="262" fill="#333" font-size="11">controlPoints, appliances (835, 836NAB…), track</text>
  <text x="54" y="278" fill="#333" font-size="11">settings; codelines [AAR Tokens@MQTT]</text>
  <rect x="54" y="290" width="270" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="64" y="311" fill="#333">fieldUnit.host: Sargent</text>
  <path d="M 150 290 C 150 252, 134 232, 134 198" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="54" y="336" width="270" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="64" y="354" fill="#333">devices[]  a row: serves Sargent:835</text>
  <text x="64" y="370" fill="#555" font-size="11">type switch/lock; bindings:</text>
  <text x="64" y="385" fill="#555" font-size="11">M → chip Sargent/0x20 pin B1, N → B2 …</text>
  <text x="64" y="400" fill="#555" font-size="11">a chip pin is the attachment's address;</text>
  <text x="64" y="415" fill="#555" font-size="11">a row has no identity</text>
  <text x="54" y="446" fill="#333" font-size="12">geometry: placements, track polylines</text>
  <path d="M 230 336 C 250 272, 220 232, 190 198" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <!-- Sargent is a station on the code line: blue, via the gaps -->
  <path d="M 272 274 L 348 274 L 348 213 L 389 213 L 389 134 L 430 122" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#b)"/>

  <!-- interlocking Caltrain -->
  <rect x="356" y="220" width="300" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="370" y="240" font-weight="bold" fill="#333">interlockings."Gilroy Caltrain"</text>
  <text x="370" y="262" fill="#333" font-size="12">controlPoints, appliances (773, 774NAB), track, settings</text>
  <rect x="370" y="290" width="270" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="311" fill="#333">fieldUnit.host: Caltrain</text>
  <path d="M 600 290 C 600 252, 630 232, 640 198" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="370" y="336" width="270" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="354" fill="#333">devices[]  serves Gilroy Caltrain:774NAB</text>
  <text x="380" y="370" fill="#555" font-size="11">bindings: LAMP → chip Caltrain/CMRI pin OUT.7</text>
  <text x="380" y="385" fill="#555" font-size="11">no row names the transport or the UA</text>
  <path d="M 630 336 C 660 282, 690 232, 690 198" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- machine -->
  <rect x="672" y="220" width="288" height="250" rx="8" fill="#dde6f0" stroke="#555" stroke-width="1.5"/>
  <text x="686" y="240" font-weight="bold" fill="#333">machines."SPCoast South"</text>
  <text x="686" y="262" fill="#333" font-size="11">panelStyle, columns{13: Sargent}, attachments[]</text>
  <rect x="686" y="290" width="260" height="34" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="696" y="311" fill="#333">officeUnit.host: SPCoast South</text>
  <path d="M 900 290 C 900 252, 870 232, 860 198" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="686" y="336" width="260" height="86" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="696" y="354" fill="#333">devices[]  column SPCoast South:13</text>
  <text x="696" y="370" fill="#555" font-size="11">lever/lock serves Sargent:835</text>
  <text x="696" y="385" fill="#555" font-size="11">bindings: WLS → SPCoast South/0x2C pin A7</text>
  <text x="696" y="400" fill="#555" font-size="11">every reference is a qualified name</text>
  <path d="M 760 422 L 760 456 L 340 456 L 340 380 L 326 380" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="430" y="451" fill="#b00000" font-size="11">serves Sargent:835: the same form in any scope</text>
  <!-- the machine's columns 13 attach to Sargent over the code line: blue, via the gaps -->
  <path d="M 950 275 L 955 275 L 955 213 L 759 213 L 759 136 L 574 136 L 564 116" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#b)"/>
  <text x="400" y="217" fill="#1f5fbf" font-size="11">codelines[]: a station on the line</text>
  <text x="686" y="278" fill="#1f5fbf" font-size="11">attachments[]: 13 → Sargent over AAR Tokens@MQTT</text>

</svg>
