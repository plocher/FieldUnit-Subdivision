<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="700" fill="#ffffff"/>
  <title>SPCoast under the rule: which declaration each sheet's attachments find</title>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b00000"/></marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#333">SPCoast under the rule</text>
  <text x="20" y="50" fill="#555">Yellow: declarations.  White: attachments with their one address.  Red dashed: the scope a binding was found in.  Solid: a wire.</text>

  <!-- root sheet -->
  <rect x="20" y="70" width="960" height="110" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="34" y="92" font-weight="bold" fill="#333">root sheet  South-cTc   (layout scope)</text>
  <rect x="40" y="104" width="260" height="60" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="50" y="122" fill="#333" font-weight="bold">Codeline-Transport-MQTT</text>
  <text x="50" y="138" fill="#333" font-size="12">Broker, Topic, Railroad</text>
  <text x="50" y="154" fill="#333" font-size="12">Host: (empty = office processor)</text>
  <rect x="330" y="104" width="260" height="60" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="340" y="122" fill="#333" font-weight="bold">Codeline-Transport-CMRInet</text>
  <text x="340" y="138" fill="#333" font-size="12">Port, Baud</text>
  <text x="340" y="154" fill="#333" font-size="12">Host: (empty = office processor)</text>
  <rect x="620" y="104" width="160" height="60" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="630" y="122" fill="#333" font-weight="bold">…TimeCode, Loconet</text>
  <text x="630" y="138" fill="#333" font-size="12">unused today</text>
  <rect x="800" y="104" width="160" height="60" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="810" y="122" fill="#333" font-weight="bold">Processor  office</text>
  <text x="810" y="138" fill="#333" font-size="12">implicit: one per machine</text>
  <text x="810" y="154" fill="#333" font-size="12">declares the desk's I2C</text>

  <!-- Caltrain sheet -->
  <rect x="20" y="200" width="300" height="300" rx="10" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="34" y="222" font-weight="bold" fill="#333">sheet  Gilroy Caltrain</text>
  <rect x="40" y="236" width="260" height="60" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="50" y="254" fill="#333" font-weight="bold">Processor  Caltrain node</text>
  <text x="50" y="270" fill="#333" font-size="12">attaches: Address 30 (UA)</text>
  <text x="50" y="286" fill="#333" font-size="12">Transport: CMRInet   Board: cpNode</text>
  <path d="M 170 236 C 170 210, 400 200, 460 164" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="470" y="194" fill="#b00000" font-size="11">layout: one CMRInet</text>
  <rect x="40" y="320" width="120" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="48" y="338" fill="#333" font-size="12" font-weight="bold">Driver-CMRI-IB</text>
  <text x="48" y="354" fill="#333" font-size="12">Bit 1</text>
  <rect x="180" y="320" width="120" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="188" y="338" fill="#333" font-size="12" font-weight="bold">Driver-CMRI-OB</text>
  <text x="188" y="354" fill="#333" font-size="12">Bit 20</text>
  <text x="100" y="392" fill="#555" font-size="12">… 34 drivers, Bit only</text>
  <path d="M 100 320 L 100 296" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <path d="M 240 320 L 240 296" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="110" y="312" fill="#b00000" font-size="11">sheet</text>
  <rect x="40" y="410" width="260" height="76" rx="6" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="50" y="428" fill="#555" font-size="12">A second node in this interlocking: draw it and</text>
  <text x="50" y="444" fill="#555" font-size="12">its drivers on a sub-sheet. The sub-sheet is</text>
  <text x="50" y="460" fill="#555" font-size="12">the scope; still no field on any driver.</text>
  <text x="50" y="478" fill="#555" font-size="12">Today's Address and UA on 34 drivers: retired.</text>

  <!-- Interchange sheet -->
  <rect x="340" y="200" width="320" height="300" rx="10" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="354" y="222" font-weight="bold" fill="#333">sheet  Gilroy Interchange</text>
  <rect x="360" y="236" width="140" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="368" y="254" fill="#333" font-size="12" font-weight="bold">Driver-JMRI-Turnout</text>
  <text x="368" y="270" fill="#333" font-size="12">no address</text>
  <rect x="505" y="236" width="150" height="48" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="511" y="254" fill="#333" font-size="11" font-weight="bold">Driver-JMRI-SignalMast</text>
  <text x="518" y="270" fill="#333" font-size="12">no address</text>
  <text x="420" y="302" fill="#555" font-size="12">… 16 JMRI drivers, nothing written</text>
  <path d="M 430 236 C 430 200, 300 190, 200 164" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="96" y="194" fill="#b00000" font-size="11">layout: one MQTT</text>

  <rect x="360" y="320" width="140" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="368" y="338" fill="#333" font-size="12" font-weight="bold">Driver-GPIO-Pixel  D2</text>
  <text x="368" y="354" fill="#333" font-size="12">declares one chain</text>
  <rect x="520" y="320" width="130" height="48" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="528" y="338" fill="#333" font-size="11" font-weight="bold">Processor Interchange</text>
  <text x="528" y="354" fill="#333" font-size="12">implicit (GPIO owner)</text>
  <path d="M 500 344 L 520 344" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <rect x="360" y="400" width="88" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="366" y="416" fill="#333" font-size="11" font-weight="bold">Cast Head A</text>
  <text x="366" y="432" fill="#333" font-size="11">Address 1</text>
  <rect x="456" y="400" width="88" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="462" y="416" fill="#333" font-size="11" font-weight="bold">Cast Head B</text>
  <text x="462" y="432" fill="#333" font-size="11">Address 2</text>
  <rect x="552" y="400" width="98" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="558" y="416" fill="#333" font-size="11" font-weight="bold">Heads C, A, B, C</text>
  <text x="558" y="432" fill="#333" font-size="11">3, 5, 6, 7</text>
  <line x1="404" y1="368" x2="404" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="404" y1="384" x2="600" y2="384" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="384" x2="500" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="600" y1="384" x2="600" y2="400" stroke="#333" stroke-width="2"/>
  <text x="360" y="470" fill="#555" font-size="12">wire scope: six casts on one chain,</text>
  <text x="360" y="486" fill="#555" font-size="12">two masts (778NAB, 778SAB), spans disjoint</text>

  <!-- Sargent sheet -->
  <rect x="680" y="200" width="300" height="300" rx="10" fill="#e9eef5" stroke="#555" stroke-width="1.5"/>
  <text x="694" y="222" font-weight="bold" fill="#333">sheet  Sargent</text>
  <rect x="700" y="236" width="260" height="44" rx="6" fill="#fff3cc" stroke="#8a6d00" stroke-width="2"/>
  <text x="710" y="254" fill="#333" font-size="12" font-weight="bold">Processor  Sargent  (implicit)</text>
  <text x="710" y="270" fill="#333" font-size="12">declares I2C and GPIO</text>
  <rect x="700" y="300" width="80" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="706" y="316" fill="#333" font-size="11" font-weight="bold">MCP23017</text>
  <text x="706" y="332" fill="#333" font-size="11">0x20</text>
  <rect x="790" y="300" width="80" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="796" y="316" fill="#333" font-size="11" font-weight="bold">PCA9685</text>
  <text x="796" y="332" fill="#333" font-size="11">0x26, 0x27</text>
  <rect x="880" y="300" width="80" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="886" y="316" fill="#333" font-size="11" font-weight="bold">GPIO D3, D2</text>
  <text x="886" y="332" fill="#333" font-size="11">pin names</text>
  <path d="M 740 300 L 740 280" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <path d="M 830 300 L 830 280" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <path d="M 920 300 L 920 280" fill="none" stroke="#b00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="700" y="372" fill="#555" font-size="12">devices and casts by wire to chip pins;</text>
  <text x="700" y="388" fill="#555" font-size="12">MC1 on the D2 chain, Address 1</text>

  <rect x="700" y="404" width="260" height="84" rx="6" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="710" y="422" fill="#555" font-size="12" font-weight="bold">Variant: the field unit polls its own nodes</text>
  <text x="710" y="440" fill="#555" font-size="12">Codeline-Transport-CMRInet  Sargent-IO</text>
  <text x="710" y="456" fill="#555" font-size="12">Host: Sargent, drawn on this sheet; its two</text>
  <text x="710" y="472" fill="#555" font-size="12">nodes bind here (sheet) before the root (layout).</text>

  <!-- footer -->
  <rect x="20" y="520" width="960" height="160" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="34" y="542" fill="#333" font-weight="bold">Counting the edits the rule asks for</text>
  <text x="34" y="564" fill="#333">Caltrain: add one Processor symbol; remove UA and Address from 34 drivers (one script).   Interchange: nothing for the 16 JMRI drivers; Style CL on six casts.</text>
  <text x="34" y="584" fill="#333">Sargent: nothing.   Root: Host stays empty on both transports.   A second CMRInet line: one more transport symbol, one Transport field per node outside its scope.</text>
  <text x="34" y="612" fill="#333" font-weight="bold">What the lint can now say</text>
  <text x="34" y="634" fill="#333">duplicate address on one declaration (0x20 twice, Bit 7 twice on one node, UA 30 twice on one line, pixel spans overlapping on one chain);</text>
  <text x="34" y="652" fill="#333">an attachment with two declarations in reach and no field; an attachment with none; every override, as info.</text>
</svg>
